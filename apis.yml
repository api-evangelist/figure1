aid: figure1
name: Figure1
description: >-
  Figure 1 is a Toronto-based social platform and mobile app for verified
  healthcare professionals to view, share, and discuss real-world, de-identified
  patient cases and medical images. Founded in 2013 by Dr. Joshua Landy, Richard
  Penner, and Gregory Levey, it has grown to more than one million healthcare
  professionals and one of the world's largest libraries of crowd-sourced
  medical cases, with trained specialists reviewing and de-identifying each
  image before publication. Figure 1 also produces the DDx medical podcast and a
  clinical blog, and in 2024 formed the parent company Formedics with Physician's
  Weekly to deepen healthcare-professional engagement. It is a portfolio company
  of Union Square Ventures. Figure 1 is a consumer/professional, mobile-first
  product with no publicly documented developer API.
